# ═══════════════════════════════════════════════════════════════════════════
# application.properties — Yojsetu Backend Configuration
#
# This file is read by Spring Boot at startup time (not compile time).
# Properties here override Spring Boot's auto-configured defaults.
# Format: key=value (no quotes around values)
# ═══════════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────────
# SERVER CONFIGURATION
# ───────────────────────────────────────────────────────────────────────────

# The port the embedded Tomcat server listens on.
# 8080 is the conventional default for HTTP development servers.
# If you ever get "Port 8080 already in use" on startup, something else
# (another app, or a previous run that didn't shut down cleanly) is using it.
# You can change this to any free port, e.g. server.port=9090
server.port=8080


# ───────────────────────────────────────────────────────────────────────────
# DATABASE — DATASOURCE CONFIGURATION
# ───────────────────────────────────────────────────────────────────────────
#
# These three properties tell Spring Boot how to connect to MySQL.
# Spring Boot reads them and passes them to HikariCP (its built-in connection
# pool) which opens a pool of pre-warmed database connections at startup.
#
# ⚠  IMPORTANT: HikariCP tests the database connection at application startup,
#    even if you have zero tables and haven't run any SQL yet.
#    This means:
#      • If MySQL is running and credentials are correct → app starts ✓
#      • If MySQL is down OR password is wrong → app FAILS to start with:
#        "HikariPool-1 - Exception during pool initialization"
#    This is expected and correct — it catches misconfigured connections early.
#
# ⚠  NOTE: There are NO spring.jpa.* properties in this file.
#    That is intentional. This project uses plain Spring JDBC (JdbcTemplate),
#    NOT JPA/Hibernate. JPA auto-configuration is simply not on the classpath
#    (we added spring-boot-starter-jdbc, not spring-boot-starter-data-jpa),
#    so Spring Boot will not attempt to configure any JPA/ORM layer.
# ───────────────────────────────────────────────────────────────────────────

# The JDBC URL tells the driver:
#   • Protocol:     jdbc:mysql    → use the MySQL JDBC driver
#   • Host:         localhost     → MySQL is running on this same machine
#   • Port:         3306          → MySQL's default port
#   • Database:     yojsetu_db   → the schema you created in MySQL Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/yojsetu_db

# The MySQL user that Spring Boot will log in as.
# Using root for local development is fine.
# In production you would create a dedicated limited-privilege user instead.
spring.datasource.username=root

# Your MySQL root password.
# ⚠  TODO: Replace YOUR_MYSQL_ROOT_PASSWORD with your actual password.
#    Do NOT commit the real password to Git. In future weeks, this will
#    move to an environment variable or a secrets manager.
spring.datasource.password=YOUR_MYSQL_ROOT_PASSWORD

# Tells Spring which JDBC Driver class to use.
# The MySQL Connector/J driver (mysql-connector-j) provides this class.
# Spring Boot can usually auto-detect this from the URL scheme (jdbc:mysql)
# but specifying it explicitly avoids any ambiguity.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
